function home(){app.innerHTML=`<p class="eyebrow">PARTS OF SPEECH</p><h1>英語の4品詞を、ひとつずつ。</h1><p class="intro">まずは例文で違いを確認。次に穴埋め問題で練習しよう。</p><div class="cards">${guides.map(g=>`<section class="card" style="--accent:${g.accent};--tint:${g.tint}"><div class="card-title"><div class="initial" aria-hidden="true">${g.initial}</div><h2>${g.name}<span>${g.ja}</span></h2></div><p class="definition">${g.desc}</p><div class="example"><p lang="en">${marked(g.example)}</p><p class="translation">${g.translation}</p><p class="example-hint">${g.hint}</p></div><p class="small-label">よくある語尾 → 例</p><div class="suffixes">${g.suffix.map(([s,e])=>`<div class="suffix"><b>${s}</b><span lang="en">${e}</span></div>`).join('')}</div></section>`).join('')}</div><div class="cta"><div><strong>穴埋め問題で練習</strong><p>TOEIC Part 5風の品詞問題・全75問</p></div><button class="primary" data-go="levels">練習問題を始める &nbsp; →</button></div>`;finish();}
function choose(){app.innerHTML=`<button class="back" data-go="home">← Homeに戻る</button><p class="eyebrow">PRACTICE</p><h1>難易度を選ぶ</h1><p class="intro">各15問。TOEIC Part 5風の英文で、空欄に入る語形を選びます。</p><div class="levels">${levels.map((n,i)=>`<button class="level" data-level="${i}"><span class="level-no">0${i+1}</span><span><span class="level-name">${n}</span><span class="level-desc" style="display:block">${descriptions[i]}</span></span><span class="level-meta">15問 &nbsp; →</span></button>`).join('')}</div>`;finish();}
function quiz(reset=false){if(reset){answers=Array(15).fill(null);submitted=false;}if(submitted){results();return;}app.innerHTML=`<div class="quiz"><button class="back" data-go="levels">← 難易度選択に戻る</button><p class="eyebrow">LEVEL 0${active+1} / PRACTICE</p><h1>${levels[active]}</h1><p class="intro">空欄に入る最も適切な英単語を選んでください。</p><div class="progress-wrap"><div class="progress-label"><span>回答の進み具合</span><span id="count" aria-live="polite"></span></div><progress id="progress" max="15" value="0" aria-label="回答済みの問題数"></progress></div><form id="quiz-form">${data[active].map((q,i)=>`<fieldset class="question"><legend><div class="q-top"><span class="q-num">QUESTION ${String(i+1).padStart(2,'0')}</span></div><div class="sentence" lang="en">${blank(q[0])}</div></legend><div class="options">${q[3].map((t,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} required><span class="choice"><span>${t}</span></span></label>`).join('')}</div></fieldset>`).join('')}<div class="submit-area"><button class="primary" id="submit" type="submit" disabled>Submit — 答え合わせ</button><p id="remaining"></p></div></form></div>`;update();finish();}
function update(){const n=answers.filter(x=>x!==null).length;document.getElementById('count').textContent=`${n} / 15 問 回答済み`;document.getElementById('progress').value=n;document.getElementById('submit').disabled=n!==15;document.getElementById('remaining').textContent=n===15?'すべて回答しました。答え合わせへ進めます。':`あと${15-n}問で答え合わせできます。`;}
function actionButtons(){return '<div class="actions"><button class="primary" data-retry>もう一度挑戦</button><button class="secondary" data-go="levels">別の難易度に挑戦</button><button class="secondary" data-go="home">Homeに戻る</button></div>';}
function results(){const score=data[active].filter((q,i)=>q[1]===answers[i]).length;const rate=Math.round(score/15*1000)/10;app.innerHTML=`<div class="quiz"><button class="back" data-go="levels">← 難易度選択に戻る</button><p class="eyebrow">LEVEL 0${active+1} / RESULT</p><h1>${levels[active]}の採点結果</h1><section class="score" aria-label="採点結果"><div><div class="score-count">${score}<span> / 15問</span></div><p class="score-text">正解数</p></div><div class="rate"><b>${rate}<span style="font-size:18px">%</span></b><p class="score-text">正答率</p></div></section>${actionButtons()}<h2 class="review-title">全15問の答えと解説</h2>${data[active].map((q,i)=>{const ok=answers[i]===q[1];return `<article class="question ${ok?'correct':'incorrect'}"><div class="q-top"><span class="q-num">QUESTION ${String(i+1).padStart(2,'0')}</span><span class="badge">${ok?'✓ 正解':'✕ 不正解'}</span></div><p class="sentence" lang="en">${marked(q[0])}</p><div class="answer-line"><span>あなたの回答<b>${label(q,answers[i])}</b></span><span>正解<b>${label(q,q[1])}</b></span></div><div class="explanation"><p class="explanation-label">解説</p><p>${q[2]}</p><p class="word-types">${q[3].map((w,j)=>`${w}：${jp[q[4][j]]}`).join(" ／ ")}</p></div></article>`;}).join('')}${actionButtons()}</div>`;finish();}
function navigate(view){if(location.hash==='#'+view)render();else location.hash=view;}
function render(){const hash=location.hash.slice(1);const match=/^practice-([1-5])$/.exec(hash);if(hash==='levels')choose();else if(match){const next=Number(match[1])-1;const reset=active!==next;active=next;quiz(reset);}else home();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){navigate(b.dataset.go);}else if(b.dataset.level!==undefined){const next=+b.dataset.level;active=next;answers=Array(15).fill(null);submitted=false;navigate('practice-'+(active+1));}else if(b.hasAttribute('data-retry')){quiz(true);}});
app.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){answers[Number(e.target.name.slice(1))]=Number(e.target.value);update();}});
app.addEventListener('submit',e=>{e.preventDefault();if(answers.some(x=>x===null))return;submitted=true;results();});
window.addEventListener('hashchange',render);render();
</script></body></html>
